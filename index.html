<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE BATTLE</title>
<style>
/* โทนสไตล์ The Sims: ฟ้าใส กรอบมน ปุ่มเขียวเงา พลัมบ็อบลอยได้ */
:root{--sky1:#bfe6fb;--sky2:#6fb8e8;--panel:rgba(255,255,255,.9);--ink:#143a55;--line:#8fcdf0;--green:#4cd964;--green2:#1fa83a;--gold:#ffc83d;--red:#e8575b;--muted:#4f7894;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#17344f;--sky2:#0f2236;--panel:rgba(18,40,62,.92);--ink:#e6f4ff;--line:#2f6a96;--muted:#9bc2dd}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Sarabun","Leelawadee UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2));background-attachment:fixed}
.scr{display:none;min-height:100%;padding:14px;max-width:820px;margin:0 auto;flex-direction:column;gap:12px}
.scr.on{display:flex}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 5px 0 rgba(20,58,85,.18)}
h1,h2,p{margin:0}
.btn{font:inherit;font-weight:700;font-size:1.1rem;color:#fff;background:linear-gradient(180deg,#5fdc78,var(--green2));border:3px solid #fff;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 0 #14782a;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14782a}
.btn.alt{background:linear-gradient(180deg,#7cc8f5,#2f8fd0);box-shadow:0 4px 0 #1b5f93}
.btn.warn{background:linear-gradient(180deg,#ff8b8e,var(--red));box-shadow:0 4px 0 #a02d31}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.plumb{width:54px;height:90px;margin:0 auto;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);background:linear-gradient(135deg,#9bff9f,var(--green) 45%,#12902c);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.plumb{animation:none}}
#menu{justify-content:center;align-items:center;text-align:center}
#menu .panel{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:2.3rem;font-weight:800;letter-spacing:.04em;line-height:1.1}
.sub{color:var(--muted)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud .cell{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:6px 10px;text-align:center}
.hud b{display:block;font-size:1.35rem}
.hud small{color:var(--muted)}
.goal{background:#fff7d6;color:#5a4300;border:3px solid var(--gold);border-radius:14px;padding:8px 12px;font-weight:700}
.bar{height:14px;border-radius:9px;background:rgba(0,0,0,.14);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .1s linear}
.bar i.low{background:var(--red)}
.tag{display:inline-block;background:#d9f2ff;color:#143a55;border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700}
.q{font-size:1.25rem;font-weight:700;line-height:1.5;margin-top:8px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{font:inherit;text-align:left;font-size:1.05rem;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;color:#143a55;cursor:pointer;min-height:48px}
.opt.ok{background:#c8f5d0;border-color:var(--green2)}
.opt.no{background:#ffd3d4;border-color:var(--red)}
.exp{margin-top:10px;padding:10px;border-radius:12px;background:#eaf6ff;color:#143a55;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{font-size:3rem;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:1.5rem}
.rv{border-left:8px solid var(--green2)}
.rv.bad{border-left-color:var(--red)}
.rv p{margin-top:6px;line-height:1.5}
label.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-weight:700}
</style>
</head>
<body>

<!-- หน้าหลัก -->
<section id="menu" class="scr on">
  <div class="panel">
    <div class="plumb" aria-hidden="true"></div>
    <div class="logo">PROTOTYPE BATTLE</div>
    <p class="sub">ศึกชิงนักสร้างต้นแบบ · ม.4 วิชา PBL</p>
    <button class="btn" id="bStart">เริ่มเกม</button>
    <button class="btn alt" id="bSet">ตั้งค่า</button>
    <button class="btn warn" id="bExit">ออกจากเกม</button>
  </div>
</section>

<!-- หน้าเล่น: แถบคะแนน เวลา เป้าหมาย อยู่ด้านบนสุด -->
<section id="play" class="scr">
  <div class="hud">
    <div class="cell"><small>คะแนน</small><b id="hScore">0</b></div>
    <div class="cell"><small>เวลา (วินาที)</small><b id="hTime">20</b></div>
    <div class="cell"><small>ข้อที่</small><b id="hNo">1/12</b></div>
  </div>
  <div class="goal" id="hGoal"></div>
  <div class="bar"><i id="hBar"></i></div>
  <div class="panel"><span class="tag" id="qTag"></span><div class="q" id="qText"></div><div class="opts" id="qOpts"></div><div class="exp" id="qExp" hidden></div></div>
  <div class="row"><button class="btn" id="bNext" hidden>ข้อถัดไป</button><button class="btn alt" id="bQuit">กลับหน้าหลัก</button></div>
</section>

<!-- สรุปผล -->
<section id="result" class="scr">
  <div class="panel" style="text-align:center">
    <h2>สรุปผลการเรียนรู้</h2>
    <div class="big" id="rScore">0</div>
    <p class="sub">จากคะแนนเต็ม <span id="rMax"></span></p>
    <h2 id="rLevel" style="margin-top:8px"></h2>
    <p id="rMsg" class="sub"></p>
  </div>
  <div class="panel stats">
    <div><small>เปอร์เซ็นต์</small><b id="rPct">0%</b></div>
    <div><small>ตอบถูก</small><b id="rOk">0</b></div>
    <div><small>ตอบผิด</small><b id="rBad">0</b></div>
  </div>
  <div class="row"><button class="btn alt" id="bReview">ทบทวนเฉลยทุกข้อ</button><button class="btn" id="bAgain">เล่นอีกครั้ง</button><button class="btn warn" id="bHome">หน้าหลัก</button></div>
</section>

<!-- ทบทวนหลังเล่น -->
<section id="review" class="scr">
  <div class="panel"><h2>ทบทวนเฉลยและคำอธิบาย</h2></div>
  <div id="rvList" style="display:grid;gap:10px"></div>
  <div class="row"><button class="btn" id="rvBack">กลับไปหน้าสรุปผล</button></div>
</section>

<!-- ตั้งค่า -->
<section id="set" class="scr">
  <div class="panel">
    <h2>ตั้งค่า</h2>
    <label class="sw">เสียงเอฟเฟกต์ <input type="checkbox" id="tSfx" checked></label>
    <label class="sw">เวลาต่อข้อ (วินาที) <input type="number" id="tSec" min="10" max="60" value="20" style="width:80px;font:inherit;padding:6px"></label>
  </div>
  <div class="row"><button class="btn" id="setBack">กลับหน้าหลัก</button></div>
</section>

<script>
/* =====================================================================
   PROTOTYPE BATTLE — แก้ไขเนื้อหาที่อาร์เรย์ QUESTIONS, LEVELS และค่า POINT ด้านล่าง
   ===================================================================== */
const POINT = 10; // คะแนนต่อข้อ (12 ข้อ x 10 = 120)

/* ระดับนักนวัตกรรม: min = เปอร์เซ็นต์ขั้นต่ำ เรียงจากสูงไปต่ำ */
const LEVELS = [
 { min:90, name:"นักนวัตกรรมระดับปรมาจารย์", msg:"เข้าใจกระบวนการสร้างต้นแบบอย่างลึกซึ้ง พร้อมสร้างชิ้นงานจริงแล้ว!" },
 { min:70, name:"นักสร้างต้นแบบมืออาชีพ", msg:"เข้าใจเนื้อหาได้ดี ทบทวนข้อที่พลาดอีกนิดก็เยี่ยมแล้ว" },
 { min:50, name:"นักประดิษฐ์ฝึกหัด", msg:"เริ่มเข้าใจแล้ว ลองทบทวนเฉลยแล้วเล่นอีกครั้ง" },
 { min:0,  name:"ผู้เริ่มต้นแห่งห้องทดลอง", msg:"ไม่เป็นไร ทบทวนเฉลยทุกข้อแล้วลองใหม่ได้เลย" }
];

/* รูปแบบข้อมูล: { t:"หัวข้อ", q:"โจทย์", a:["คำตอบที่ถูก (ตัวแรกเสมอ)","ผิด","ผิด","ผิด"], e:"คำอธิบายเฉลย" }
   เกมสลับลำดับข้อและลำดับตัวเลือกให้อัตโนมัติ */
const QUESTIONS = [
 { t:"ความหมาย", q:"Prototype หมายถึงข้อใด", a:["ต้นแบบชิ้นงานที่สร้างขึ้นเพื่อทดลองและทดสอบแนวคิด","สินค้าสำเร็จรูปที่วางขายแล้ว","แผนการตลาดของสินค้า","รายการวัสดุที่ต้องซื้อ"], e:"Prototype คือต้นแบบสำหรับทดลองแนวคิด ยังไม่ใช่ผลิตภัณฑ์สุดท้าย" },
 { t:"ความหมาย", q:"เหตุใดจึงควรสร้างต้นแบบก่อนผลิตจริง", a:["ลดความเสี่ยงและค่าใช้จ่ายจากความผิดพลาด","เพื่อให้ไม่ต้องทดสอบผลงาน","เพื่อให้ผลิตจริงได้ช้าลง","เพื่อใช้วัสดุให้มากที่สุด"], e:"ถ้าพบข้อผิดพลาดตั้งแต่ต้นแบบ จะแก้ไขได้ง่ายและถูกกว่าการแก้ตอนผลิตจริง" },
 { t:"ประเภท", q:"ต้นแบบกระดาษ (Paper Prototype) เหมาะกับการทำสิ่งใดมากที่สุด", a:["ทดลองโครงร่างหรือหน้าจอได้เร็วและราคาถูก","ทดสอบความทนทานต่อฝน","ทดสอบระบบไฟฟ้าจริง","ผลิตสินค้าจำนวนมาก"], e:"ต้นแบบกระดาษทำเร็ว แก้ง่าย เหมาะกับการสำรวจแนวคิดช่วงแรก" },
 { t:"ประเภท", q:"ต้นแบบที่ทำงานได้ (Functional Prototype) ต่างจากต้นแบบกระดาษอย่างไร", a:["ใช้ทดสอบการทำงานจริงของชิ้นงานได้","ทำจากกระดาษเท่านั้น","ไม่ต้องมีการออกแบบ","ใช้แทนสินค้าขายจริงได้ทันที"], e:"ต้นแบบที่ทำงานได้ช่วยให้ทดสอบฟังก์ชัน เช่น กลไกหรือวงจร ได้จริง" },
 { t:"การเลือกวัสดุ", q:"ต้องการทดลองรูปทรงอย่างรวดเร็วโดยใช้งบน้อย ควรเลือกวัสดุใด", a:["กระดาษแข็งหรือโฟม","เหล็กหนา","แผ่นอะคริลิกตัดเลเซอร์","ไม้เนื้อแข็ง"], e:"วัสดุราคาถูกและตัดต่อง่ายเหมาะกับต้นแบบช่วงแรก" },
 { t:"การเลือกวัสดุ", q:"ต้นแบบที่ต้องตั้งกลางแจ้งและโดนฝน ควรเลือกวัสดุใดเป็นหลัก", a:["พลาสติกหรือท่อ PVC","กระดาษแข็งธรรมดา","กระดาษทราย","โฟมบางไม่เคลือบ"], e:"วัสดุต้องเหมาะกับสภาพแวดล้อมที่ใช้งานจริง" },
 { t:"การสร้าง", q:"ก่อนลงมือสร้างต้นแบบ ควรทำสิ่งใด", a:["ร่างแบบ วางขั้นตอน และเตรียมวัสดุ","ตกแต่งสีให้สวยก่อน","ซื้อวัสดุราคาแพงทั้งหมด","เขียนรายงานสรุปผลล่วงหน้า"], e:"การวางแผนช่วยประหยัดเวลาและวัสดุ" },
 { t:"การสร้าง", q:"ต้นแบบชิ้นแรกควรให้ความสำคัญกับสิ่งใดก่อน", a:["ฟังก์ชันหลักที่แก้ปัญหา","ความสวยงามทุกรายละเอียด","ชื่อและโลโก้","บรรจุภัณฑ์"], e:"ต้องพิสูจน์ก่อนว่าไอเดียแก้ปัญหาได้ แล้วค่อยปรับรูปลักษณ์" },
 { t:"การทดสอบ", q:"เหตุผลหลักของการทดสอบต้นแบบคือข้อใด", a:["หาข้อบกพร่องและสิ่งที่ยังขาด","ให้ครูเห็นว่าทำเสร็จแล้ว","เพื่อเลิกทำโครงงาน","เพื่อประกวดความสวย"], e:"ผลการทดสอบบอกว่าต้องปรับปรุงจุดใดบ้าง" },
 { t:"การทดสอบ", q:"วิธีทดสอบต้นแบบที่ดีคือข้อใด", a:["ให้ผู้ใช้จริงลองใช้และบันทึกผล","ให้คนทำทดลองเองคนเดียวโดยไม่จดบันทึก","ดูจากภาพถ่ายอย่างเดียว","ไม่ต้องทดสอบ"], e:"ผู้ใช้จริงช่วยให้เห็นปัญหาที่ผู้สร้างมองไม่เห็น" },
 { t:"การปรับปรุง", q:"ผู้ใช้บอกว่าปุ่มบนต้นแบบกดยาก ควรทำอย่างไร", a:["ปรับขนาดหรือตำแหน่งปุ่ม แล้วทดสอบซ้ำ","บอกว่าผู้ใช้ใช้ผิดวิธี","ไม่ต้องแก้ไข","ทิ้งโครงงานทันที"], e:"นำข้อเสนอแนะมาปรับปรุง และทดสอบซ้ำเพื่อยืนยันว่าดีขึ้น" },
 { t:"การปรับปรุง", q:"ลำดับวงจรพัฒนาต้นแบบที่ถูกต้องคือข้อใด", a:["สร้าง → ทดสอบ → วิเคราะห์ → ปรับปรุง","ปรับปรุง → จบงาน → สร้าง","ทดสอบ → ขาย → สร้าง","วิเคราะห์ → ทิ้งงาน → สร้าง"], e:"วงจรนี้ทำซ้ำได้หลายรอบจนต้นแบบตอบโจทย์" }
];

/* ---------- ตัวแปรและฟังก์ชันช่วย ---------- */
const $ = id => document.getElementById(id);
let cfg = { sfx:true, sec:20 };           // ตั้งค่า (ไม่บันทึกถาวร)
let G = null;                              // สถานะเกมรอบปัจจุบัน
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
function show(id){ document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }

/* ---------- เสียงเอฟเฟกต์ (Web Audio ไม่ใช้ไฟล์ภายนอก) ---------- */
let AC=null;
function beep(freqs){ if(!cfg.sfx) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
  freqs.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*.11; o.type="triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.2); }); }catch(e){} }

/* ---------- เริ่มเกม ---------- */
function startGame(){
  G = { list:shuffle(QUESTIONS).map(q=>({ ...q, opts:shuffle(q.a.map((t,k)=>({t,k}))) })), i:0, score:0, left:cfg.sec, tm:null, locked:false, log:[] };
  $("hGoal").textContent="เป้าหมายภารกิจ: ทำคะแนนให้ได้ "+Math.round(G.list.length*POINT*.7)+" คะแนนขึ้นไป เพื่อเป็นนักสร้างต้นแบบมืออาชีพ";
  show("play"); showQ();
}
function showQ(){
  const q=G.list[G.i]; G.locked=false; G.left=cfg.sec; clearInterval(G.tm);
  $("hNo").textContent=(G.i+1)+"/"+G.list.length; $("hScore").textContent=G.score;
  $("qTag").textContent="หัวข้อ: "+q.t; $("qText").textContent=q.q; $("qExp").hidden=true; $("bNext").hidden=true;
  const box=$("qOpts"); box.innerHTML="";
  q.opts.forEach((o,idx)=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=o.t; b.onclick=()=>answer(idx); box.appendChild(b); });
  tick(); G.tm=setInterval(()=>{ G.left-=.1; tick(); if(G.left<=0) answer(-1); },100);
}
function tick(){ const p=Math.max(0,G.left/cfg.sec*100); $("hBar").style.width=p+"%"; $("hBar").className=p<30?"low":""; $("hTime").textContent=Math.ceil(Math.max(0,G.left)); }
/* idx = ลำดับปุ่มที่เลือก, -1 = หมดเวลา */
function answer(idx){
  if(G.locked) return; G.locked=true; clearInterval(G.tm);
  const q=G.list[G.i], right=idx>=0 && q.opts[idx].k===0;
  document.querySelectorAll("#qOpts .opt").forEach((b,n)=>{ b.disabled=true; if(q.opts[n].k===0) b.classList.add("ok"); else if(n===idx) b.classList.add("no"); });
  if(right){ G.score+=POINT; beep([660,880]); } else beep([240]);
  G.log.push({ q, picked: idx>=0?q.opts[idx].t:null, right });
  $("hScore").textContent=G.score;
  $("qExp").hidden=false; $("qExp").textContent=(right?"ถูกต้อง! ":idx>=0?"ยังไม่ถูก ":"หมดเวลา ")+q.e;
  $("bNext").hidden=false; $("bNext").textContent=G.i+1<G.list.length?"ข้อถัดไป":"ดูสรุปผล"; $("bNext").focus();
}
$("bNext").onclick=()=>{ if(G.i+1<G.list.length){ G.i++; showQ(); } else showResult(); };

/* ---------- สรุปผลและทบทวน ---------- */
function showResult(){
  const n=G.list.length, max=n*POINT, ok=G.log.filter(x=>x.right).length, pct=Math.round(ok/n*100), lv=LEVELS.find(l=>pct>=l.min);
  $("rScore").textContent=G.score; $("rMax").textContent=max; $("rPct").textContent=pct+"%"; $("rOk").textContent=ok; $("rBad").textContent=n-ok;
  $("rLevel").textContent=lv.name; $("rMsg").textContent=lv.msg; beep([523,659,784,1047]); show("result");
}
$("bReview").onclick=()=>{
  const box=$("rvList"); box.innerHTML="";
  G.log.forEach((x,i)=>{ const d=document.createElement("div"); d.className="panel rv"+(x.right?"":" bad");
    d.innerHTML='<span class="tag">'+x.q.t+'</span><p><b>ข้อ '+(i+1)+'. '+x.q.q+'</b></p><p>คำตอบของคุณ: '+(x.picked||"หมดเวลา")+(x.right?" ✔":" ✘")+'</p><p>คำตอบที่ถูก: '+x.q.a[0]+'</p><p class="sub">'+x.q.e+'</p>';
    box.appendChild(d); });
  show("review"); };
$("rvBack").onclick=()=>show("result");
$("bAgain").onclick=startGame;
$("bHome").onclick=()=>show("menu");

/* ---------- เมนูและตั้งค่า ---------- */
$("bStart").onclick=startGame;
$("bQuit").onclick=()=>{ clearInterval(G&&G.tm); show("menu"); };
$("bSet").onclick=()=>{ $("tSfx").checked=cfg.sfx; $("tSec").value=cfg.sec; show("set"); };
$("setBack").onclick=()=>{ cfg.sfx=$("tSfx").checked; cfg.sec=Math.min(60,Math.max(10,+$("tSec").value||20)); show("menu"); };
$("bExit").onclick=()=>{ try{ window.close(); }catch(e){}
  document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;text-align:center;font-size:1.4rem;padding:20px">ขอบคุณที่เล่น PROTOTYPE BATTLE<br><br>ปิดแท็บนี้ได้เลย หรือ <a href="" style="color:inherit">เล่นอีกครั้ง</a></div>'; };
</script>
</body>
